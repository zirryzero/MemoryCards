<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryCards - Nivel Fácil</title>
    <script src="https://kit.fontawesome.com/14ac42b08d.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css" />
</head>

<body onload="onLoad()">
    <div class="pantalla-juego nivel-facil">
        <header class="barra-superior">
            <div class="titulo-nivel">
                <h2>MemoryCards</h2>
                <span class="badge-dificultad facil" data-i18n="badge_facil">Nivel Fácil</span>
            </div>
            <div class="controles-cabecera">
                <button id="btn-lang-toggle" class="bubbly-button btn-lang" onclick="alternarIdioma()" title="Switch to English">
                    🌐 EN
                </button>
                <a href="index.html" class="btn-volver-inicio" title="Volver al Menú Principal" data-i18n="btn_inicio">
                    <i class="fas fa-home"></i> Inicio
                </a>
            </div>
        </header>

        <div class="contenedor-juego">
            <!-- Panel de Estadísticas y Controles -->
            <aside class="panel-lateral">
                <div class="caja-perfil">
                    <span class="icono-usuario">
                        <i class="far fa-user"></i>
                    </span>
                    <div id="caja-nick" class="caja-nick">Jugador</div>
                </div>

                <div class="stats-grid">
                    <div class="caja-stat">
                        <span class="label-stat" data-i18n="stat_tiempo"><i class="fas fa-stopwatch"></i> Tiempo</span>
                        <h3 class="crono" id="crono">00:00:00</h3>
                    </div>
                    <div class="caja-stat">
                        <span class="label-stat" data-i18n="stat_intentos"><i class="fas fa-shoe-prints"></i> Intentos</span>
                        <h3 class="valor-stat" id="contador-movimientos">0</h3>
                    </div>
                    <div class="caja-stat">
                        <span class="label-stat" data-i18n="stat_parejas"><i class="fas fa-check-circle"></i> Parejas</span>
                        <h3 class="valor-stat" id="contador-parejas">0 / 6</h3>
                    </div>
                </div>

                <div class="controles">
                    <button id="btn-iniciar" class="bubbly-button btn-accion iniciar" onclick="iniciarJuego()" data-i18n="btn_iniciar">
                        <i class="fas fa-play"></i> Iniciar
                    </button>
                    <button id="btn-reset" class="bubbly-button btn-accion reset" onclick="resetearJuego()" data-i18n="btn_reiniciar">
                        <i class="fas fa-undo-alt"></i> Reiniciar
                    </button>
                    <button id="btn-highscores" class="bubbly-button btn-accion btn-score-menu" onclick="abrirModalHighScores()" data-i18n="btn_highscores">
                        <i class="fas fa-trophy"></i> Récords
                    </button>
                </div>
            </aside>

            <!-- Tablero de Cartas -->
            <main class="area-tablero">
                <div class="juego" id="juego">
                    <div class="grid-tablero grid-facil" id="tablero-cartas">
                        <!-- Generado dinámicamente -->
                    </div>
                </div>
            </main>
        </div>

        <!-- Modal de Victoria -->
        <div id="modal-victoria" class="modal-victoria hide">
            <div class="modal-contenido">
                <div class="icono-trofeo">🏆</div>
                <h2 data-i18n="victoria_titulo_facil">¡Felicidades, <span id="victoria-nick">Jugador</span>!</h2>
                <p class="subtitulo-victoria" data-i18n="victoria_sub_facil">Has completado el Nivel Fácil</p>
                <div class="resumen-partida">
                    <div class="item-resumen">
                        <span data-i18n="victoria_tiempo_label">Tiempo:</span>
                        <strong id="victoria-tiempo">00:00:00</strong>
                    </div>
                    <div class="item-resumen">
                        <span data-i18n="victoria_intentos_label">Intentos:</span>
                        <strong id="victoria-intentos">0</strong>
                    </div>
                </div>
                <div class="modal-acciones">
                    <button class="bubbly-button btn-modal" onclick="resetearJuego(); cerrarModal();" data-i18n="btn_jugar_nuevo">
                        <i class="fas fa-redo"></i> Jugar de Nuevo
                    </button>
                    <button class="bubbly-button btn-modal btn-score-menu" onclick="cerrarModal(); abrirModalHighScores();" data-i18n="btn_highscores">
                        <i class="fas fa-trophy"></i> Ver Récords
                    </button>
                    <a href="niveldificil.html">
                        <button class="bubbly-button btn-modal btn-siguiente" data-i18n="btn_siguiente_nivel">
                            Siguiente Nivel <i class="fas fa-arrow-right"></i>
                        </button>
                    </a>
                    <a href="index.html">
                        <button class="bubbly-button btn-modal btn-menu" data-i18n="btn_menu_principal">
                            <i class="fas fa-home"></i> Menú Principal
                        </button>
                    </a>
                </div>
            </div>
        </div>

        <!-- Modal de High Scores -->
        <div id="modal-highscores" class="modal-victoria hide">
            <div class="modal-contenido modal-scores-box">
                <h2 data-i18n="modal_highscores_titulo">🏆 Tabla de Puntuaciones Altas</h2>
                
                <div class="tabs-niveles-scores">
                    <button id="tab-score-facil" class="tab-score activa" onclick="cambiarPestanaPuntuacion('facil')" data-i18n="badge_facil">Nivel Fácil</button>
                    <button id="tab-score-dificil" class="tab-score" onclick="cambiarPestanaPuntuacion('dificil')" data-i18n="badge_dificil">Nivel Difícil</button>
                </div>

                <div class="tabla-scores-wrapper">
                    <table class="tabla-scores">
                        <thead>
                            <tr>
                                <th data-i18n="th_pos">Pos</th>
                                <th data-i18n="th_jugador">Jugador</th>
                                <th data-i18n="th_tiempo">Tiempo</th>
                                <th data-i18n="th_intentos">Intentos</th>
                                <th data-i18n="th_fecha">Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-scores-body">
                            <!-- Inyectado por scores.js -->
                        </tbody>
                    </table>
                </div>

                <div class="modal-acciones" style="margin-top: 15px;">
                    <button class="bubbly-button btn-modal btn-menu" onclick="cerrarModalHighScores()" data-i18n="btn_cerrar">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/scores.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/iniciar.js"></script>
</body>

</html>
